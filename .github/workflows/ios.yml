name: iOS build

# Proves the iOS app compiles with the toolchain App Store Connect requires
# (Xcode 26 / iOS 26 SDK), then installs it on an iPhone and an iPad simulator
# and takes a launch screenshot of each. Signing and uploading still happen in
# Xcode on a Mac (see vault/App Store/Release Checklist.md).

on:
  push:
    branches: [main, "feat/ios-*"]
    paths:
      - "ios/**"
      - "src/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show the Xcode in use (App Store Connect needs 26 or later)
        run: xcodebuild -version && xcrun simctl list runtimes

      - run: npm ci

      - name: Build the web app and copy it into the iOS project
        run: npm run ios:sync

      - name: Compile for a real device (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Compile for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build | tail -n 20

      - name: Launch on iPhone and iPad simulators
        run: |
          APP=$(find build/sim -name "App.app" -path "*iphonesimulator*" | head -1)
          mkdir -p shots
          shoot () {
            local NAME="$1"
            local UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys,re; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if re.search(sys.argv[1], x['name'])]; print(c[-1]['udid'] if c else '')" "$NAME")
            if [ -z "$UDID" ]; then echo "No simulator matching $NAME"; return 0; fi
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.hakeemhannoon.hackerpdf
            sleep 12
            xcrun simctl io "$UDID" screenshot "shots/$(echo "$NAME" | tr -c 'A-Za-z0-9' '-').png"
            xcrun simctl shutdown "$UDID" || true
          }
          shoot "iPhone .* Pro Max"
          shoot "iPad Pro 13"
          ls -la shots
          # A launch that only shows the splash is a tiny, flat PNG; the real
          # start screen is far bigger. Fail loudly if the web app didn't load.
          for f in shots/*.png; do
            sz=$(stat -f%z "$f"); echo "$f: $sz bytes"
            if [ "$sz" -lt 60000 ]; then echo "::error::$f looks like a blank or splash-only screen"; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/
